<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#F1F3EF">
<script>
/* Applique tout de suite le thème et la taille du texte choisis (évite un flash au démarrage) */
try { var t = localStorage.getItem('manza-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      if (localStorage.getItem('manza-size') === 'large') document.documentElement.dataset.size = 'large'; } catch (e) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Manza">
<meta name="description" content="Carnet de suivi de Manza : séances, poids, ration et actualités équestres.">
<title>Manza – carnet de suivi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐴</text></svg>">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1A2230; --muted:#5D6676; --line:#DCE0D8;
  --blue:#24479A; --on-blue:#FFFFFF; --blue-soft:#E4EAF6;
  --ochre:#B07D22; --ochre-soft:#F6ECD6; --danger:#B3261E;
  --h0:#E4E7E0; --h1:#C3D0EC; --h2:#8EA7DC; --h3:#5174C2; --h4:#24479A;
  --font-d:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ok:#1F8A73; --ok-soft:#DDF1EC; --late-soft:#F8E1DF; color-scheme:light;
}
/* Mode sombre : automatique (selon le téléphone) sauf si le mode clair est imposé, ou imposé dans les paramètres */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141C; --surface:#1A202B; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2B3342;
    --blue:#8AA8EE; --on-blue:#10141C; --blue-soft:#22304D;
    --ochre:#E2B45E; --ochre-soft:#3A3020; --danger:#F2867E;
    --h0:#232B38; --h1:#2B3F6A; --h2:#3D5DA2; --h3:#6286D4; --h4:#9BB6F4;
    --ok:#5CC9AE; --ok-soft:#183A33; --late-soft:#3D2424; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#10141C; --surface:#1A202B; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2B3342;
    --blue:#8AA8EE; --on-blue:#10141C; --blue-soft:#22304D;
    --ochre:#E2B45E; --ochre-soft:#3A3020; --danger:#F2867E;
    --h0:#232B38; --h1:#2B3F6A; --h2:#3D5DA2; --h3:#6286D4; --h4:#9BB6F4;
    --ok:#5CC9AE; --ok-soft:#183A33; --late-soft:#3D2424; color-scheme:dark;
}
/* Grande taille de texte */
html[data-size="large"] .app, html[data-size="large"] .sheet-head, html[data-size="large"] .sheet-body,
html[data-size="large"] .tabs-in{zoom:1.12}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-b);
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
img{max-width:100%;display:block}
.app{max-width:560px;margin:0 auto;padding:12px 16px calc(100px + env(safe-area-inset-bottom,0px))}

/* En-tête */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0 20px}
.name{font:700 clamp(60px,19vw,92px)/.8 var(--font-d);letter-spacing:-.01em;margin:0}
.sub{margin:10px 0 0;color:var(--muted);font-size:15px}
.save-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;margin-top:4px}
.save-btn svg{width:20px;height:20px}
.save-btn.alert{border-color:var(--ochre);color:var(--ochre)}
.top > div{min-width:0}
@media (max-width:480px){
  .save-btn{width:46px;height:46px;padding:0;justify-content:center;border-radius:12px;flex:0 0 auto}
  .save-btn svg{width:23px;height:23px}
  .save-btn .lbl{display:none}
}

/* Vues */
.view{display:none}
.view.active{display:block}
h2{font:600 30px/1.1 var(--font-d);margin:0 0 14px}
h3{font:600 21px/1.2 var(--font-d);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.empty-msg{color:var(--muted);font-size:15px;margin:4px 0}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;
  border-radius:12px;border:0;font-weight:600;font-size:16px;text-decoration:none}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:20px;height:20px}
.cta{margin:0 0 14px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:600 30px/1 var(--font-d)}
.stat span{font-size:13px;color:var(--muted)}

/* Bandeau sauvegarde */
.banner{display:none;background:var(--ochre-soft);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.banner.show{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Calendrier */
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{font-size:12px;color:var(--muted);text-align:center;margin-bottom:4px}
.cal-grid{touch-action:pan-y}
.cal-cell{aspect-ratio:1/1.08;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-weight:500;font-size:15px;padding:0}
.cal-cell.empty{pointer-events:none}
.cal-cell.has{background:var(--blue-soft)}
.cal-cell.today .num{box-shadow:0 0 0 2px var(--ochre);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.cal-cell.future{color:var(--muted)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}
.month-nav{display:flex;gap:6px}

/* Heatmap */
.heat-wrap{display:grid;grid-template-columns:16px 1fr;gap:4px}
.heat-months{display:grid;gap:3px;font-size:11px;color:var(--muted);height:16px;grid-column:2}
.heat-months span{white-space:nowrap;overflow:visible}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--muted);line-height:1}
.heat-days span{display:flex;align-items:center}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.hc{aspect-ratio:1;border-radius:3px;background:var(--h0);border:0;padding:0}
.hc.l1{background:var(--h1)}.hc.l2{background:var(--h2)}.hc.l3{background:var(--h3)}.hc.l4{background:var(--h4)}
.hc.out{visibility:hidden}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--muted);margin-top:8px}
.heat-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* Barres */
.bars{display:grid;gap:8px;margin-top:6px}
.bar-row{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:8px;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--h0);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--h3)}
.bar-row.top .bar i{background:var(--ochre)}
.bar-row b{text-align:right;font-weight:600}
.insight{font-size:15px;margin:2px 0 10px}
.sub-title{font-weight:600;font-size:15px;margin:18px 0 6px}

/* Séances */
.sess{display:grid;grid-template-columns:5px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0;padding-top:2px}
.sess .stripe{border-radius:3px}
.sess-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sess-title{font-weight:600}
.sess-meta{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.sess-notes{margin:8px 0 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.sess-actions{display:flex;gap:8px;margin-top:10px}
.linkish{background:none;border:0;padding:0;text-align:left;width:100%}

/* Feuille modale */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);
  border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:41;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:24px}
.sheet-body{overflow:auto;padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* Formulaires */
.field{display:block;margin:0 0 18px;border:0;padding:0;min-width:0}
.field>span,.field>legend{display:block;font-weight:600;font-size:15px;margin-bottom:7px;padding:0}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:16px var(--font-b);padding:12px;
  border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px;-webkit-appearance:none;appearance:none}
input[type=date]{display:block}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{resize:vertical;min-height:80px;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt input:focus-visible + span{outline:2px solid var(--ochre);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px;padding:4px 3px;
  border-radius:10px;border:1px solid var(--line);font-size:12.5px;line-height:1.15;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt span{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);font-size:14px;background:var(--bg)}
.opt input:checked + span{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.inline{display:flex;align-items:center;gap:8px;margin-top:10px}
.inline input{max-width:150px}
.field textarea + textarea,.scale + textarea{margin-top:10px}
.actions{display:flex;gap:10px;position:sticky;bottom:-16px;background:var(--surface);padding:12px 0 16px;margin-top:4px}
.actions .btn{flex:1}
details.calc{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:-6px 0 18px}
details.calc summary{font-weight:600;font-size:15px;cursor:pointer}
.calc-out{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.calc-out b{font:600 26px var(--font-d)}

/* Poids */
.big-weight{display:flex;align-items:baseline;gap:8px}
.big-weight b{font:700 64px/1 var(--font-d)}
.big-weight span{font:600 24px var(--font-d);color:var(--muted)}
.delta{font-size:15px;margin-top:4px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted);min-height:32px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart-tools{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:11px var(--font-b)}
.chart .line{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--blue);opacity:.1}
.chart .pt{fill:var(--surface);stroke:var(--blue);stroke-width:2}
.chart .pt.last{fill:var(--ochre);stroke:var(--ochre)}
.chart .val{fill:var(--ink);font:600 13px var(--font-b)}
.regime h4{margin:0 0 4px;font-size:15px}
.regime p{margin:0 0 12px;white-space:pre-wrap;word-break:break-word}
.regime p:last-child{margin-bottom:0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{border:0;padding:0;background:var(--h0);border-radius:10px;overflow:hidden;aspect-ratio:1;position:relative}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .cap{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;padding:12px 6px 4px;
  background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:left}
.pending{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.pending div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden}
.pending img{width:100%;height:100%;object-fit:cover}
.pending button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;
  background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1}
.file-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1px dashed var(--line);
  border-radius:12px;font-weight:600;cursor:pointer;background:var(--bg)}
.file-btn input{position:absolute;opacity:0;width:1px;height:1px}
.w-item{padding:12px 0;border-top:1px solid var(--line)}
.w-item:first-child{border-top:0;padding-top:2px}
.w-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.w-row b{font:600 22px var(--font-d)}
.w-text{font-size:14px;margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs button{border:0;padding:0;width:56px;height:56px;border-radius:8px;overflow:hidden;flex:0 0 auto}
.thumbs img{width:100%;height:100%;object-fit:cover}

/* Visionneuse */
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer.open{display:flex}
.viewer img{max-height:82vh;max-width:100%;object-fit:contain}
.viewer p{color:#ddd;font-size:14px;margin:12px 16px 0;text-align:center}
.viewer .close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;background:rgba(255,255,255,.15);
  color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:22px}

/* Actus */
.src-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.src-chips::-webkit-scrollbar{display:none}
.src-chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:38px;font-size:14px;font-weight:600}
.src-chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.news-item{display:block;text-decoration:none;color:inherit;padding:14px 0;border-top:1px solid var(--line)}
.news-item:first-child{border-top:0;padding-top:2px}
.news-meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.src-badge{font-weight:600;color:var(--blue)}
.news-title{font-weight:600;font-size:16px;line-height:1.35}
.sites{display:grid;gap:8px}
.sites a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;color:inherit;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.sites small{color:var(--muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:8px 0}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Réglages */
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.stack{display:grid;gap:10px}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}

/* Navigation basse */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:64px;font-size:13px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--blue)}
.tab.active::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:70;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


/* Santé */

.view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.view-head h2{margin:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 0 10px}
.sec-head h3{font-size:24px}
.soin{display:grid;grid-template-columns:40px 1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.soin-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.soin-ic svg{width:20px;height:20px}
.soin-main b{display:block;font-weight:600;line-height:1.25}
.soin-main small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px}
.badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.prog{grid-column:1/-1;height:5px;border-radius:3px;background:var(--h0);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:3px}
.soin.late .soin-ic,.soin.late .badge{background:var(--late-soft);color:var(--danger)}
.soin.late .prog i{background:var(--danger)}
.soin.soon .soin-ic,.soin.soon .badge{background:var(--ochre-soft);color:var(--ochre)}
.soin.soon .prog i{background:var(--ochre)}
.soin.ok .soin-ic,.soin.ok .badge{background:var(--ok-soft);color:var(--ok)}
.soin.ok .prog i{background:var(--ok)}
.soin.none .soin-ic,.soin.none .badge{background:var(--bg);color:var(--muted)}
.dashed{display:flex;justify-content:center;gap:4px 18px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:14px;padding:6px}
.dashed button{background:none;border:0;font-weight:600;min-height:40px;color:var(--blue)}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pchips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:38px;padding:0 13px;font-size:14px}
.obs{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.obs-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.obs-tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
.obs-head .small{white-space:nowrap}
.int-1,.int-2{background:var(--ochre-soft);color:var(--ochre)}
.int-3{background:var(--late-soft);color:var(--danger)}
.obs-note{display:block;margin:0 0 8px;white-space:pre-wrap;word-break:break-word}
.obs-up{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
.obs-foot{display:flex;align-items:center;gap:10px;margin-top:4px}
.obs-photo{width:52px;height:52px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg);
  padding:0;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.obs-photo img{width:100%;height:100%;object-fit:cover}
.obs-photo svg{width:22px;height:22px}
.obs-count{font-size:13px;color:var(--muted);flex:1}
.obs-actions{display:flex;gap:8px;margin-top:12px}
.obs-actions .btn{flex:1}
.const{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.const div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.const span{font-size:13px;color:var(--muted)}
.const b{display:block;font:600 30px/1.1 var(--font-d)}
.const small{font-size:13px;color:var(--muted);font-weight:500;font-family:var(--font-b)}
.const .warn{border-color:var(--danger)}
.const .warn b{color:var(--danger)}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zone-grid .opt span{display:flex;justify-content:center;align-items:center;min-height:46px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);font-size:14px;text-align:center;padding:0 6px}
.segf{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.segf .opt span{display:flex;justify-content:center;align-items:center;min-height:46px;background:var(--bg);font-size:15px}
.segf .opt + .opt span{border-left:1px solid var(--line)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:18px}
.switch-row b{display:block}
.switch-row small{color:var(--muted);font-size:13.5px}
.switch{position:relative;width:52px;height:30px;flex:0 0 auto}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--h0);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + span{background:var(--blue)}
.switch input:checked + span::after{transform:translateX(22px)}
.switch input:focus-visible + span{outline:2px solid var(--ochre);outline-offset:2px}
.id-name{font:700 44px/1 var(--font-d);margin:0}
.contact{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.contact small{display:block;color:var(--muted);font-size:13px}
.contact b{display:block}
.contact .t{display:block;color:var(--muted);font-size:14px}
.call{width:46px;height:46px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.call.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.call svg{width:20px;height:20px}
.st-ok{color:var(--ok)} .st-late{color:var(--danger)} .st-soon{color:var(--ochre)}
.list-row{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.list-row:first-child{border-top:0;padding-top:2px}
.list-row b{display:block}
.list-row span{font-size:14px;color:var(--muted)}
.rem-status{font-size:15px;margin:0 0 12px}
.pref{margin:0 0 22px}
.pref > b{display:block;font-size:15px;margin-bottom:8px}
.pref .note{margin-top:8px}
.segf.two{grid-template-columns:repeat(2,1fr)}
.pref-group{font:600 13px var(--font-b);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 12px}
#printArea{display:none}
@media print{
  body{background:#fff !important;color:#000 !important;padding:0 !important}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block !important;font:10.5pt/1.45 Arial,Helvetica,sans-serif;color:#000}
  #printArea h1{font-size:20pt;margin:0 0 2pt}
  #printArea h2{font-size:13pt;margin:16pt 0 6pt;padding-bottom:3pt;border-bottom:1.5pt solid #24479A;color:#24479A}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{text-align:left;vertical-align:top;padding:4pt 6pt;border-bottom:.5pt solid #ccc}
  #printArea th{width:32%;font-weight:600}
  #printArea thead th{width:auto;background:#eef1f8}
  #printArea .pm{color:#555;margin:0}
  #printArea p{margin:0 0 6pt;white-space:pre-wrap}
  @page{margin:14mm}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

<script>
(() => {
'use strict';

/* ================= Configuration ================= */
const ACTIVITIES = [
  { id:'pied',    label:'Travail à pied',  color:'#24479A' },
  { id:'liberte', label:'Liberté',          color:'#2A9A86' },
  { id:'renes',   label:'Longues rênes',    color:'#7B52B8' },
  { id:'longe',   label:'Longe',            color:'#C48A22' },
  { id:'monte',   label:'Monte',            color:'#C4394B' },
  { id:'balade',  label:'Balade',           color:'#4F8A2E' },
  { id:'soin',    label:'Soin',             color:'#8792A6' }
];
const FORME = ['Fatigué','Mou','Normal','Motivé','Très motivé'];
const SENSATIONS = ['Difficile','Moyenne','Correcte','Bonne','Excellente'];
const HUMEURS = ['Calme','Attentif','Joueur','Distrait','Tendu','Chaud','Câlin'];
const METEO = [
  { id:'soleil', label:'☀️ Soleil' }, { id:'nuages', label:'☁️ Nuageux' }, { id:'pluie', label:'🌧️ Pluie' },
  { id:'vent', label:'💨 Vent' }, { id:'froid', label:'❄️ Froid' }, { id:'chaud', label:'🥵 Chaud' }, { id:'orage', label:'⛈️ Orage' }
];
const METHODS = ['Balance','Ruban','Estimation'];
const WEEKDAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

/* Sources d'actualités (sites de référence). Modifiable ici. */
const SOURCES = [
  { id:'ffe',       name:'FFE',        full:'Fédération Française d’Équitation', domain:'ffe.com',        url:'https://www.ffe.com' },
  { id:'ifce',      name:'IFCE',       full:'Institut français du cheval et de l’équitation', domain:'ifce.fr', url:'https://www.ifce.fr' },
  { id:'eperon',    name:'L’Éperon',   full:'Magazine des sports équestres', domain:'leperon.fr',     url:'https://www.leperon.fr' }
];
/* Source principale : le fichier news.json, mis à jour automatiquement par GitHub (fichier actus.yml).
   Solution de secours si ce fichier n'existe pas encore : un service de lecture de flux RSS. */
const NEWS_FILE = 'news.json';
const RSS2JSON = u => 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(u);

/* ================= Utilitaires ================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); return addDays(x, -((x.getDay()+6)%7)); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (n, d=1) => Number(n).toLocaleString('fr-FR', { maximumFractionDigits:d });
const fmtLong = k => cap(parseYmd(k).toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }));
const fmtDate = k => parseYmd(k).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
const fmtShort = d => d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
const act = id => ACTIVITIES.find(a => a.id === id) || ACTIVITIES[0];
const parseNum = v => { const n = parseFloat(String(v).replace(',', '.').trim()); return isNaN(n) ? null : n; };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================= Base de données (IndexedDB) ================= */
const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      // Version 2 : ajoute uniquement les tiroirs Santé. Les données existantes ne sont pas modifiées.
      const r = indexedDB.open('manza-carnet', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        ['sessions','weights','photos','meta','soins','observations','constants'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath:'id' }); });
      };
      r.onsuccess = () => {
        this.db = r.result;
        this.db.onversionchange = () => { this.db.close(); toast('Nouvelle version disponible : recharge la page.'); };
        const b = document.getElementById('blockedBanner'); if (b) b.remove();
        res();
      };
      r.onerror = () => rej(r.error);
      r.onblocked = () => {
        if (document.getElementById('blockedBanner')) return;
        document.querySelector('.app').insertAdjacentHTML('afterbegin',
          '<div class="banner show" id="blockedBanner">Mise à jour en attente : ferme les autres onglets ou fenêtres de l’application Manza, puis recharge cette page. Tes données ne risquent rien.</div>');
      };
    });
  },
  req(store, mode, fn){
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode); const q = fn(tx.objectStore(store));
      tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all(s){ return this.req(s, 'readonly', o => o.getAll()); },
  get(s, id){ return this.req(s, 'readonly', o => o.get(id)); },
  put(s, v){ return this.req(s, 'readwrite', o => o.put(v)); },
  del(s, id){ return this.req(s, 'readwrite', o => o.delete(id)); },
  clear(s){ return this.req(s, 'readwrite', o => o.clear()); },
  putMany(s, arr){ return this.req(s, 'readwrite', o => { arr.forEach(v => o.put(v)); }); }
};

let sessions = [], weights = [], photos = [], soins = [], observations = [], constants = [], fiche = {};
async function loadAll(){
  [sessions, weights, photos, soins, observations, constants] = await Promise.all(
    ['sessions','weights','photos','soins','observations','constants'].map(st => DB.all(st)));
  observations.sort((a,b) => b.date.localeCompare(a.date) || (b.created||0) - (a.created||0));
  constants.sort((a,b) => (b.date + (b.time||'')).localeCompare(a.date + (a.time||'')) || (b.created||0) - (a.created||0));
  fiche = (await getMeta('fiche')) || {};
  sessions.sort((a,b) => b.date.localeCompare(a.date) || (b.created||0) - (a.created||0));
  weights.sort((a,b) => b.date.localeCompare(a.date) || (b.created||0) - (a.created||0));
  photos.sort((a,b) => b.date.localeCompare(a.date));
}

function renderCalendar(){

function renderHeatmap(){
  const WEEKS = 26;
  const start = addDays(mondayOf(new Date()), -(WEEKS-1)*7);
  const tk = todayKey();
  const load = {};
  sessions.forEach(s => { load[s.date] = (load[s.date] || 0) + (s.duration || 30); });
  const level = v => !v ? 0 : v <= 30 ? 1 : v <= 60 ? 2 : v <= 90 ? 3 : 4;

  let months = '', cells = '', prevMonth = -1;
  for (let w = 0; w < WEEKS; w++){
    const monday = addDays(start, w*7);
    const mo = monday.getMonth();
    months += `<span>${mo !== prevMonth && w < WEEKS-2 ? monday.toLocaleDateString('fr-FR', { month:'short' }).replace('.', '') : ''}</span>`;
    prevMonth = mo;
    for (let d = 0; d < 7; d++){
      const day = addDays(monday, d); const key = ymd(day);
      if (key > tk){ cells += '<span class="hc out"></span>'; continue; }
      const v = load[key] || 0;
      cells += `<button class="hc l${level(v)}" data-action="open-day" data-date="${key}" aria-label="${fmtLong(key)} : ${v ? v + ' min' : 'aucune séance'}"></button>`;
    }
  }
  $('#heatmap').innerHTML = `
    <div class="heat-wrap">
      <div class="heat-months" style="grid-template-columns:repeat(${WEEKS},1fr)">${months}</div>
      <div class="heat-days"><span>L</span><span></span><span>M</span><span></span><span>V</span><span></span><span>D</span></div>
      <div class="heat" style="grid-template-columns:repeat(${WEEKS},1fr)">${cells}</div>
    </div>
    <div class="heat-legend">Moins <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> Plus</div>`;
}

/* ================= POIDS ================= */
let chartMode = 'week', chartPeriod = 182;

function weightPoints(){
  let pts = weights.filter(w => w.weight).map(w => ({ date: parseYmd(w.date), v: w.weight })).sort((a,b) => a.date - b.date);
  if (chartPeriod){ const lim = addDays(new Date(), -chartPeriod); pts = pts.filter(p => p.date >= lim); }
  if (chartMode === 'week'){
    const g = new Map();
    pts.forEach(p => { const k = ymd(mondayOf(p.date)); const o = g.get(k) || { sum:0, n:0 }; o.sum += p.v; o.n++; g.set(k, o); });
    pts = [...g.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([k,o]) => ({ date: parseYmd(k), v: o.sum/o.n }));
  }
  return pts;
}

function renderWeightChart(){
  const pts = weightPoints();
  const el = $('#weightChart');
  if (!pts.length){ el.innerHTML = '<p class="empty-msg">Pas encore de pesée sur cette période.</p>'; return; }
  const W = 340, H = 200, L = 38, R = 14, T = 22, B = 26;
  let min = Math.min(...pts.map(p => p.v)), max = Math.max(...pts.map(p => p.v));
  if (max - min < 10){ const mid = (max+min)/2; min = mid - 5; max = mid + 5; }
  const padv = (max - min) * .12; min = Math.floor(min - padv); max = Math.ceil(max + padv);
  const n = pts.length;
  const x = i => n === 1 ? L + (W-L-R)/2 : L + i * (W-L-R)/(n-1);
  const y = v => T + (max - v) * (H-T-B) / (max - min);
  let grid = '';
  for (let i = 0; i <= 4; i++){
    const v = min + (max-min) * i/4; const yy = y(v);
    grid += `<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="axis" x="${L-6}" y="${yy+4}" text-anchor="end">${Math.round(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 5));
  let xl = '';
  pts.forEach((p, i) => { if (i % step === 0 || i === n-1){ if (i !== n-1 && n-1 - i < step/2 && i !== 0) return; xl += `<text class="axis" x="${x(i)}" y="${H-6}" text-anchor="middle">${fmtShort(p.date).replace('.', '')}</text>`; } });
  const line = pts.map((p,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = n > 1 ? `${line} L${x(n-1)},${H-B} L${x(0)},${H-B} Z` : '';
  const dots = pts.map((p,i) => `<circle class="pt${i === n-1 ? ' last' : ''}" cx="${x(i)}" cy="${y(p.v)}" r="${n > 30 ? 2.5 : 4}"><title>${fmtShort(p.date)} : ${num(p.v)} kg</title></circle>`).join('');
  const last = pts[n-1];
  const lx = Math.min(Math.max(x(n-1), L+20), W-R-20);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de poids, dernière valeur ${num(last.v)} kg">
    ${grid}${area ? `<path class="area" d="${area}"/>` : ''}<path class="line" d="${line}"/>${dots}${xl}
    <text class="val" x="${lx}" y="${y(last.v) - 10}" text-anchor="middle">${num(last.v)} kg</text></svg>`;
}

async function compressImage(file, max = 1280, q = .78){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image illisible')); i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

let news = [], newsFetchedAt = 0, newsCheckedAt = 0, newsFilter = 'all', newsLoading = false;

async function fetchWithTimeout(url, ms = 9000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal, cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.text(); }
  finally { clearTimeout(t); }
}

/* 1) Fichier news.json du dépôt GitHub (même site, aucun blocage possible) */
async function loadFromRepo(){
  const data = JSON.parse(await fetchWithTimeout(NEWS_FILE + '?t=' + Date.now(), 8000));
  if (!data || !Array.isArray(data.items) || !data.items.length) throw new Error('fichier vide');
  return {
    items: data.items.filter(n => n && n.title && n.link),
    at: Date.parse(data.updated) || Date.now(),
    failed: (data.failed || []).map(id => (SOURCES.find(s => s.id === id) || {}).name).filter(Boolean)
  };
}

/* 2) Secours : lecture directe des flux via rss2json */
async function fetchSourceFallback(src){
  const feed = `https://news.google.com/rss/search?q=${encodeURIComponent('site:' + src.domain)}&hl=fr&gl=FR&ceid=FR:fr`;
  const data = JSON.parse(await fetchWithTimeout(RSS2JSON(feed), 10000));
  if (data.status !== 'ok' || !Array.isArray(data.items) || !data.items.length) throw new Error(data.message || 'flux vide');
  return data.items.map(it => {
    let title = (it.title || '').trim();
    title = title.replace(/\s+-\s+[^-]{2,60}$/, '');
    const d = Date.parse(String(it.pubDate || '').replace(' ', 'T') + 'Z') || Date.parse(it.pubDate) || 0;
    return { title, link: it.link || src.url, date: d, source: src.id };
  }).filter(n => n.title);
}

async function loadNews(force){
  if (newsLoading) return;
  if (!force && news.length && Date.now() - newsCheckedAt < 30*60*1000){ renderNews(); return; }
  newsLoading = true;
  if (!news.length) $('#newsList').innerHTML = '<div class="loading"><span class="spinner"></span>Chargement des actualités…</div>';
  else $('#newsStatus').innerHTML = '<span class="loading" style="padding:0"><span class="spinner"></span>Mise à jour…</span>';

  let fresh = [], failed = [], at = 0;
  try {
    const r = await loadFromRepo(); fresh = r.items; failed = r.failed; at = r.at;
  } catch {
    const results = await Promise.allSettled(SOURCES.map(fetchSourceFallback));
    fresh = results.flatMap(r => r.status === 'fulfilled' ? r.value : []);
    failed = SOURCES.filter((s, i) => results[i].status === 'rejected').map(s => s.name);
    at = Date.now();
  }
  newsCheckedAt = Date.now();
  if (fresh.length){
    const seen = new Set();
    news = fresh.filter(n => { const k = n.title.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).sort((a,b) => b.date - a.date);
    newsFetchedAt = at;
    try { await setMeta('news', { items: news, at: newsFetchedAt }); } catch {}
  }
  newsLoading = false;
  renderNews(failed, !fresh.length);
}

function relTime(ts){
  if (!ts) return '';
  const ms = Date.now() - ts;
  if (ms < 3600000){ const m = Math.max(1, Math.floor(ms / 60000)); return m < 5 ? 'à l’instant' : `il y a ${m} min`; }
  const d = Math.floor(ms / 86400000);
  if (d <= 0) return `il y a ${Math.floor(ms / 3600000)} h`;
  if (d === 1) return 'hier';
  if (d < 30) return `il y a ${d} j`;
  return new Date(ts).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
}

function renderNews(failed = [], allFailed = false){
  $('#srcChips').innerHTML = [{ id:'all', name:'Toutes' }, ...SOURCES].map(s =>
    `<button class="${newsFilter === s.id ? 'on' : ''}" data-action="news-filter" data-src="${s.id}">${esc(s.name)}</button>`).join('');
  const list = news.filter(n => SOURCES.some(x => x.id === n.source) && (newsFilter === 'all' || n.source === newsFilter));
  let status = newsFetchedAt ? `Actualités mises à jour ${relTime(newsFetchedAt)}.` : '';
  if (allFailed) status = news.length ? 'Sources injoignables pour le moment : affichage des dernières actualités enregistrées.' : '';
  else if (failed.length) status += ` Sans nouvel article récupéré : ${failed.join(', ')}.`;
  $('#newsStatus').textContent = status;
  if (!list.length){
    $('#newsList').innerHTML = allFailed && !news.length
      ? '<p class="empty-msg">Impossible de charger les actualités. Vérifie la connexion puis touche Actualiser, ou ouvre directement les sites ci-dessous.</p>'
      : '<p class="empty-msg">Aucun article récent pour cette source. Ouvre le site ci-dessous pour voir ses dernières publications.</p>';
  } else {
    $('#newsList').innerHTML = list.slice(0, 40).map(n => {
      const s = SOURCES.find(x => x.id === n.source);
      return `<a class="news-item" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">
        <div class="news-meta"><span class="src-badge">${esc(s ? s.name : '')}</span><span>${relTime(n.date)}</span></div>
        <div class="news-title">${esc(n.title)}</div></a>`;
    }).join('');
  }
  $('#siteLinks').innerHTML = SOURCES.map(s =>
    `<a href="${s.url}" target="_blank" rel="noopener noreferrer"><span><strong>${esc(s.name)}</strong><br><small>${esc(s.full)}</small></span><svg class="i" viewBox="0 0 24 24" width="20" height="20"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>`).join('');
}

/* ---------- Échéances ---------- */
function addInterval(key, n, unit){
  const d = parseYmd(key);
  if (unit === 'jours') return ymd(addDays(d, n));
  if (unit === 'semaines') return ymd(addDays(d, n*7));
  const r = new Date(d.getFullYear(), d.getMonth() + n, 1);
  r.setDate(Math.min(d.getDate(), new Date(r.getFullYear(), r.getMonth()+1, 0).getDate()));
  return ymd(r);
}
const nextOf = s => s.next || (s.last && s.every ? addInterval(s.last, s.every, s.unit) : null);
function freqText(s){
  if (!s.every) return 'ponctuel';
  if (s.every === 1) return { jours:'chaque jour', semaines:'chaque semaine', mois:'chaque mois' }[s.unit];
  return s.unit === 'semaines' ? `toutes les ${s.every} semaines` : `tous les ${s.every} ${s.unit}`;
}
function soinStatus(s){
  const n = nextOf(s);
  if (!n) return { cls:'none', label: s.last ? 'Fait' : 'À planifier', n:null, d:null, pct:0 };
  const d = daysBetween(todayKey(), n);
  let cls, label;
  if (d < 0){ cls = 'late'; label = `En retard, ${-d} j`; }
  else if (d === 0){ cls = 'late'; label = 'Aujourd’hui'; }
  else if (d <= 14){ cls = 'soon'; label = d === 1 ? 'Demain' : `Dans ${d} j`; }
  else { cls = 'ok'; label = d < 60 ? `Dans ${Math.round(d/7)} sem.` : `Dans ${Math.round(d/30.44)} mois`; }
  let pct = 100;
  if (s.last && s.last < n){ pct = Math.min(100, Math.max(2, daysBetween(s.last, todayKey()) / daysBetween(s.last, n) * 100)); }
  return { cls, label, n, d, pct };
}
const sortedSoins = () => [...soins].sort((a, b) => {
  const na = nextOf(a), nb = nextOf(b);
  if (na && nb) return na.localeCompare(nb);
  if (na) return -1; if (nb) return 1;
  return a.name.localeCompare(b.name);
});

  </button>`;
}

          await DB.put('soins', rec); await loadAll(); renderHealth(); checkBackup(); checkReminders();
          toast('Soin enregistré'); openSoinDetail(rec.id);
        } catch (err){ toast('Échec de l’enregistrement : ' + err.message); }
      };
    });
}

/* ---------- Observations ---------- */
function radioChips(name, items, value, cls){
  return `<div class="${cls}">${items.map((it, i) => {
    const v = typeof it === 'string' ? it : it.v; const l = typeof it === 'string' ? it : it.l;
    return `<label class="opt"><input type="radio" name="${name}" value="${esc(v)}" ${String(value) === String(v) ? 'checked' : ''}><span>${esc(l)}</span></label>`;
  }).join('')}</div>`;
}
const photoField = () => `<div class="field"><span>Photos</span>
  <label class="file-btn"><input type="file" accept="image/*" multiple class="photo-input">${IC.camera.replace('class="i"', 'class="i" width="20" height="20"')} Ajouter une photo</label>
  <div class="pending"></div></div>`;
function photoPicker(body, pending, removed){
  const box = body.querySelector('.pending'), input = body.querySelector('.photo-input');
  const draw = () => { box.innerHTML = pending.map((p, i) => `<div><img src="${p.data}" alt=""><button type="button" data-rm="${i}" aria-label="Retirer la photo">×</button></div>`).join(''); };
  draw();
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    const [p] = pending.splice(Number(b.dataset.rm), 1); if (p.existing) removed.push(p.id); draw();
  });
  input.addEventListener('change', async e => {
    const files = [...e.target.files]; e.target.value = '';
    for (const file of files){
      try { pending.push({ id: uid(), data: await compressImage(file), existing:false }); draw(); }
      catch { toast('Une photo n’a pas pu être lue.'); }
    }
  });
}
async function savePhotos(entryId, date, pending, removed){
  for (const pid of removed) await DB.del('photos', pid);
  const fresh = pending.filter(p => !p.existing).map(p => ({ id: p.id, entryId, date, data: p.data, kind:'obs' }));
  if (fresh.length) await DB.putMany('photos', fresh);
}
const obsLabel = o => [o.type, o.zone].filter(Boolean).join(', ') || 'Observation';

function obsCard(o){
  const ph = photos.filter(p => p.entryId === o.id);
  const since = daysBetween(o.date, todayKey());
  const ups = o.updates || [];
  const count = [ph.length ? `${ph.length} photo${ph.length > 1 ? 's' : ''}` : '', ups.length ? `${ups.length} mise${ups.length > 1 ? 's' : ''} à jour` : ''].filter(Boolean).join(', ') || INTENSITIES[(o.intensity || 1) - 1];
  return `<div class="obs">
    <div class="obs-head"><span class="obs-tag int-${o.intensity || 1}">${esc(obsLabel(o))}</span>
      <span class="small muted">${since <= 0 ? 'Aujourd’hui' : since === 1 ? 'Depuis hier' : `Depuis ${since} jours`}</span></div>
    <button class="linkish" data-action="open-obs" data-id="${o.id}">
      <span class="obs-note">${esc(o.note || 'Sans note')}</span>
      ${ups[0] ? `<span class="obs-up"><strong>${fmtShort(parseYmd(ups[0].date))} :</strong> ${esc(ups[0].note)}</span>` : ''}
    </button>
    <div class="obs-foot">
      <button class="obs-photo" data-action="${ph.length ? 'view-photo' : 'obs-update'}" data-id="${ph.length ? ph[0].id : o.id}" aria-label="${ph.length ? 'Voir la photo' : 'Ajouter un suivi avec photo'}">${ph.length ? `<img src="${ph[0].data}" alt="">` : IC.camera}</button>
      <span class="obs-count">${count}</span>
    </div>
    <div class="obs-actions">
      <button class="btn sm ghost" data-action="obs-update" data-id="${o.id}">Ajouter un suivi</button>
      <button class="btn sm primary" data-action="obs-resolve" data-id="${o.id}">Marquer résolu</button>
    </div>
  </div>`;
}

function renderObs(){
  const watch = observations.filter(o => o.watch && !o.resolved);
  $('#obsWatch').innerHTML = watch.length ? watch.map(obsCard).join('')
    : '<p class="empty-msg" style="margin:0 0 12px">Rien à surveiller pour le moment.</p>';
}

function openObsForm(id){
  const o = id ? observations.find(x => x.id === id) : { date: todayKey(), type:'', zone:'', intensity:1, note:'', watch:true };
  if (!o) return;
  const pending = id ? photos.filter(p => p.entryId === id).map(p => ({ id:p.id, data:p.data, existing:true })) : [];
  const removed = [];
  openSheet(id ? 'Modifier l’observation' : 'Nouvelle observation', `

      <label class="field"><span>Date</span><input type="date" name="date" value="${o.date}"></label>

      <div class="actions"><button type="button" class="btn ghost" data-cancel>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>
    </form>`, body => {

      f.onsubmit = async e => {
        e.preventDefault();

        const rec = { ...o, id: o.id || uid(), created: o.created || Date.now(), date: fd.get('date') || todayKey(),
          type: fd.get('type') || '', zone: fd.get('zone') || '', intensity: Number(fd.get('intensity') || 1),

        try {
          await DB.put('observations', rec); await savePhotos(rec.id, rec.date, pending, removed);
          await loadAll(); renderHealth(); checkBackup(); askPersist();

function openObsUpdate(id){

    <form id="fUp" novalidate>

const outOfRange = (k, v) => v != null && (v < NORMS[k][0] || v > NORMS[k][1]);
function constWhen(c){
  const d = daysBetween(c.date, todayKey());
  const day = d === 0 ? 'Aujourd’hui' : d === 1 ? 'Hier' : fmtShort(parseYmd(c.date));
  return c.time ? `${day}, ${c.time.replace(':', ' h ')}` : day;
}
function renderConst(){
  const c = constants[0];
  $('#constDate').textContent = c ? constWhen(c) : '';
  const tile = (k, label, v, unit, d) => `<div class="${outOfRange(k, v) ? 'warn' : ''}"><span>${label}</span><b>${v != null ? num(v, d) : '–'} <small>${unit}</small></b></div>`;
  $('#constBox').innerHTML = (c ? `<div class="const">${tile('temp', 'Température', c.temp, '°C', 1)}${tile('pouls', 'Pouls', c.pouls, '/min', 0)}${tile('resp', 'Respiration', c.resp, '/min', 0)}</div>`
    : '<p class="empty-msg" style="margin:0">Note les constantes de Manza au repos, quand tout va bien : elles serviront de référence.</p>')
    + '<p class="note">Repères pour un cheval adulte au repos : 37,5 à 38,5 °C, 28 à 44 battements et 8 à 16 respirations par minute.</p>';
}

        <label class="field"><span>Heure</span><input type="time" name="time" value="${pad(now.getHours())}:${pad(now.getMinutes())}" style="width:100%;font:16px var(--font-b);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px"></label>
      </div>
      <label class="field"><span>Température (°C)</span><input type="text" inputmode="decimal" name="temp" placeholder="ex. 37,8"></label>
      <div class="row2">
        <label class="field"><span>Pouls (/min)</span><input type="number" inputmode="numeric" name="pouls" placeholder="ex. 36"></label>
        <label class="field"><span>Respiration (/min)</span><input type="number" inputmode="numeric" name="resp" placeholder="ex. 14"></label>

      <div class="actions"><button type="button" class="btn ghost" data-cancel>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>
    </form>`, body => {

        await DB.put('constants', { id: uid(), created: Date.now(), date: f.date.value || todayKey(), time: f.time.value || '', temp, pouls, resp, note: f.note.value.trim() });
        await loadAll(); renderHealth(); closeSheet();

/* ---------- Rappels : notifications et agenda ---------- */
async function swReg(){
  if (!('serviceWorker' in navigator)) return null;
  try { return await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 3000))]); } catch { return null; }
}
async function notify(title, body, tag){
  const opts = { body, tag, icon:'icon-192.png', badge:'icon-192.png', lang:'fr', data:{ url:'./#sante' } };
  try {
    const reg = await swReg();
    if (reg) return await reg.showNotification(title, opts);
    new Notification(title, opts);
  } catch { toast(title); }
}
function dueReminders(sent){
  const out = [], tk = todayKey();
  const offs = [...(settings.remind && settings.remind.length ? settings.remind : [7, 1])].sort((a, b) => a - b);
  soins.forEach(s => {
    const n = nextOf(s); if (!n) return;
    const d = daysBetween(tk, n); let k, title;
    if (d < 0){ if (d < -30) return; k = 'late'; title = `En retard : ${s.name}`; }
    else {
      const o = offs.find(x => d <= x); if (o === undefined) return;
      k = 'j' + o; title = d === 0 ? `Aujourd’hui : ${s.name}` : d === 1 ? `Demain : ${s.name}` : `Dans ${d} jours : ${s.name}`;
    }
    const key = `${s.id}|${n}|${k}`;
    if (!sent.includes(key)) out.push({ key, title, body:`Manza : prévu le ${fmtDate(n)}.` });
  });
  return out;
}
async function checkReminders(){
  if (!DB.db || !('Notification' in window) || Notification.permission !== 'granted') return;
  const sent = (await getMeta('notifSent')) || [];
  const due = dueReminders(sent);
  for (const r of due){ await notify(r.title, r.body, r.key); sent.push(r.key); }
  if (due.length) await setMeta('notifSent', sent.slice(-300));
}
async function registerPeriodic(){
  try {
    const reg = await swReg(); if (!reg || !('periodicSync' in reg)) return false;
    const st = await navigator.permissions.query({ name:'periodic-background-sync' });
    if (st.state !== 'granted') return false;
    await reg.periodicSync.register('manza-rappels', { minInterval: 12*3600*1000 });
    return true;
  } catch { return false; }
}
async function enableNotifications(){
  if (!('Notification' in window)){ toast('Ce navigateur ne gère pas les notifications.'); return; }
  const p = await Notification.requestPermission();
  if (p !== 'granted'){ toast('Notifications non autorisées.'); renderRemCard(); return; }
  await registerPeriodic();
  await notify('Rappels activés', `Tu recevras un rappel ${remindText()} chaque soin de Manza.`, 'manza-test');
  renderRemCard(); checkReminders();
}
function renderRemCard(){
  const supported = 'Notification' in window;
  const perm = supported ? Notification.permission : 'unsupported';
  const installed = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
  let status;
  if (!supported) status = 'Ce navigateur ne gère pas les notifications. Utilise l’ajout à l’agenda ci-dessous.';
  else if (perm === 'granted') status = installed
    ? `Notifications activées : rappel ${remindText()} chaque soin.`
    : 'Notifications activées. Pour les recevoir sans ouvrir l’app, installe-la : menu ⋮ du navigateur, puis « Installer l’application ».';
  else if (perm === 'denied') status = 'Notifications bloquées. Autorise-les dans les réglages du navigateur pour ce site, puis recharge la page.';
  else status = `Reçois un rappel ${remindText()} chaque soin à venir.`;
  $('#remCard').innerHTML = `<div class="card-head" style="margin-bottom:6px"><h3>Rappels</h3></div>
    <p class="rem-status">${status}</p>
    <div class="stack">
      ${supported && perm === 'default' ? '<button class="btn primary block" data-action="notif-enable">Activer les notifications</button>' : ''}
      ${perm === 'granted' ? '<button class="btn ghost block" data-action="notif-test">Envoyer une notification de test</button>' : ''}
      <button class="btn ghost block" data-action="ics-all">Ajouter les rappels à l’agenda du téléphone</button>
    </div>
    <p class="note">L’agenda est la méthode la plus sûre : il prévient même quand l’application est fermée. Refais l’ajout après avoir noté un soin comme fait.</p>`;
}

function icsFor(list){
  const dt = d => d.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ei = v => String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Manza//Carnet de suivi//FR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  list.forEach(s => {
    const n = nextOf(s); if (!n) return;
    L.push('BEGIN:VEVENT', `UID:manza-${s.id}-${dt(n)}@manza-carnet`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${dt(n)}`, `DTEND;VALUE=DATE:${dt(ymd(addDays(parseYmd(n), 1)))}`,
      `SUMMARY:${ei('Manza : ' + s.name)}`, `DESCRIPTION:${ei((s.notes ? s.notes + '\n' : '') + 'Rappel créé depuis le carnet de Manza.')}`,
      ...(settings.remind && settings.remind.length ? settings.remind : [7, 1]).flatMap(o => ['BEGIN:VALARM', 'ACTION:DISPLAY',
        `DESCRIPTION:${ei((o === 1 ? 'Demain : ' : `Dans ${o} jours : `) + s.name)}`, o === 1 ? 'TRIGGER:-PT15H' : `TRIGGER:-P${o-1}DT15H`, 'END:VALARM']),
      'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
async function exportIcs(list, name){
  if (!list.length){ toast('Aucun soin à venir à ajouter.'); return; }
  const blob = new Blob([icsFor(list)], { type:'text/calendar' });
  if (await shareOrDownload(blob, name, 'Rappels santé de Manza')) toast('Ouvre le fichier avec ton agenda pour ajouter les rappels');
}

function remindText(){
  const r = [...(settings.remind && settings.remind.length ? settings.remind : [7, 1])].sort((a, b) => b - a);
  const parts = r.map(o => o === 1 ? '1 jour' : `${o} jours`);
  return (parts.length > 1 ? parts.slice(0, -1).join(', ') + ' puis ' + parts[parts.length - 1] : parts[0]) + ' avant';
}
function effectiveDark(){
  return settings.theme === 'dark' || (settings.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyAppearance(){
  const root = document.documentElement;
  if (settings.theme === 'auto') delete root.dataset.theme; else root.dataset.theme = settings.theme;
  if (settings.size === 'large') root.dataset.size = 'large'; else delete root.dataset.size;
  const m = document.getElementById('themeColor'); if (m) m.content = effectiveDark() ? '#10141C' : '#F1F3EF';
  try { localStorage.setItem('manza-theme', settings.theme); localStorage.setItem('manza-size', settings.size); } catch {}
}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyAppearance); } catch {}

async function shareOrDownload(blob, name, title){
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title }); return true;
    }
  } catch (e){ if (e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}

async function exportData(){
  const data = { app:'manza-carnet', version:2, exportedAt: new Date().toISOString(), sessions, weights, photos, soins, observations, constants, fiche, settings };
  const name = `manza-sauvegarde-${todayKey()}.json`;
  const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
  if (!(await shareOrDownload(blob, name, 'Sauvegarde Manza'))) return;
  await setMeta('lastBackup', Date.now()); checkBackup();
  toast('Sauvegarde exportée');
  if (sheetOpen) openSettings();
}

async function importData(file){
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'manza-carnet' || !Array.isArray(data.sessions) || !Array.isArray(data.weights)) throw new Error('fichier non reconnu');
    const hasHealth = Array.isArray(data.soins);
    if (!confirm(`Importer ${data.sessions.length} séances, ${data.weights.length} pesées, ${(data.photos||[]).length} photos${hasHealth ? `, ${data.soins.length} soins et ${(data.observations||[]).length} observations` : ''} ? Les données actuelles seront remplacées.${hasHealth ? '' : ' Ta partie Santé actuelle sera conservée.'}`)) return;
    const healthPhotos = hasHealth ? [] : photos.filter(p => p.kind === 'obs');
    await Promise.all(['sessions','weights','photos'].map(s => DB.clear(s)));
    await DB.putMany('sessions', data.sessions); await DB.putMany('weights', data.weights);
    if (Array.isArray(data.photos)) await DB.putMany('photos', data.photos);
    if (healthPhotos.length) await DB.putMany('photos', healthPhotos);
    for (const st of ['soins','observations','constants']){
      if (Array.isArray(data[st])){ await DB.clear(st); await DB.putMany(st, data[st]); }
    }
    if (data.fiche && typeof data.fiche === 'object') await setMeta('fiche', data.fiche);
    if (data.settings && typeof data.settings === 'object'){ settings = { ...DEFAULT_SETTINGS, ...data.settings }; await setMeta('settings', settings); applyAppearance(); }
    await setMeta('lastBackup', Date.now());
    await loadAll(); renderAll(); toast('Sauvegarde importée');
    if (sheetOpen) closeSheet();
  } catch (e){ toast('Import impossible : ' + e.message); }
}

async function wipe(){
  if (!confirm('Effacer définitivement toutes les séances, pesées, photos et données de santé ?')) return;
  if (!confirm('Dernière confirmation : as-tu exporté une sauvegarde ?')) return;
  await Promise.all(['sessions','weights','photos','soins','observations','constants'].map(s => DB.clear(s)));
  await DB.del('meta', 'fiche');
  await loadAll(); renderAll(); closeSheet(); toast('Données effacées');
}

    case 'obs-update': openObsUpdate(id); break;
    case 'obs-resolve': resolveObs(id, true); break;
    case 'obs-reopen': resolveObs(id, false); break;
    case 'obs-history': openObsHistory(); break;
    case 'new-const': openConstForm(); break;
    case 'const-history': openConstHistory(); break;
    case 'delete-const': deleteConst(id); break;
    case 'notif-enable': enableNotifications(); break;
    case 'notif-test': notify('Test de rappel', 'Les notifications de Manza fonctionnent.', 'manza-test'); break;
    case 'weight-mode':
      chartMode = t.dataset.mode;
      document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', b === t)); renderWeightChart(); break;
    case 'weight-period':
      chartPeriod = Number(t.dataset.p);
      document.querySelectorAll('#segPeriod button').forEach(b => b.classList.toggle('on', b === t)); renderWeightChart(); break;
  }
});
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importData(f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('#viewer').classList.contains('open')) $('#viewer').classList.remove('open'); else closeSheet(); } });

// Balayage horizontal sur le calendrier pour changer de mois
(() => {
  const g = $('#calGrid'); let sx = null, sy = null;
  g.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
  g.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftMonth(dx < 0 ? 1 : -1);
    sx = null;
  });
})();


function renderAll(){
  $('#horseSub').textContent = `${BREED}, ${ageYears()} ans`;
  renderLegend(); renderSessions(); renderWeights(); renderHealth(); checkBackup();
}

// Service worker : hors connexion, rappels en arrière-plan, clic sur une notification
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && DB.db){ renderHealth(); renderSessStats(); checkReminders(); }
});

/* ================= Démarrage ================= */
(async () => {
  try {
    await DB.open();
    settings = { ...DEFAULT_SETTINGS, ...((await getMeta('settings')) || {}) };
    applyAppearance();
    await loadAll();
    const cached = await getMeta('news');
    if (cached && cached.items){ news = cached.items; newsFetchedAt = cached.at || 0; }
    renderAll();
    askPersist();
    const startTab = location.hash === '#sante' ? 'sante' : settings.startTab;
    if (startTab && startTab !== 'seances') showTab(startTab);
    checkReminders();
    if ('Notification' in window && Notification.permission === 'granted') registerPeriodic();
  } catch (e){
    document.querySelector('.app').insertAdjacentHTML('afterbegin',
      `<div class="banner show" style="background:var(--ochre-soft)">Le stockage du navigateur est indisponible (navigation privée ?). Les données ne pourront pas être enregistrées.</div>`);
    renderLegend(); renderSessions(); renderWeights();
  }
})();

})();
</script>
</body>
</html>
